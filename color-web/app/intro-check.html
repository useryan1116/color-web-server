<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ColorLab｜影片相容性對照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#423c3a;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 20px}h1{font-size:26px;margin:18px 0 12px}p{margin:12px 0}a{color:#88425d}button{font:inherit;padding:10px 20px;border:1px solid #baa9ad;border-radius:24px;background:#fff;color:#423c3a;min-height:44px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #88425d;outline-offset:3px}.actions{display:flex;gap:12px;flex-wrap:wrap}.screen{height:240px;margin:20px 0;background:#eee9df;border-radius:16px;overflow:hidden}video{display:block;width:100%;height:100%;object-fit:contain}ol{padding-left:26px}li{padding:14px 0;border-bottom:1px solid #ddd4cb}li strong,li span{display:block}.note{color:#736665;font-size:14px}#status{min-height:2em}h2{font-size:18px}
</style><script type="module" src="/app/intro-check.mjs"></script></head>
<body><main><a href="/app/account.html#about">← 回到關於我們</a><h1>影片相容性對照</h1>
<p>請在無法播放的 iPad 上測試。六個版本使用同一段動畫，每個約四秒；遇到無法載入時會等候最多十五秒。</p>
<p class="note">降低尺寸或幀率的版本只用來查原因，不會更改正式站的 4K、120 幀設定。測試不收集帳號或個資，也不會把結果傳到伺服器。</p>
<p>已完成六項的裝置，可以追加標準直式 UHD 4K 測試：2160 × 3840、120 幀、HEVC。畫面等比例縮放、上下留邊，不裁切或拉伸。</p>
<div class="actions"><button id="uhd" type="button">只測標準 4K120</button><button id="start" type="button">開始六項對照測試</button><button id="stop" type="button" disabled>停止</button></div>
<p id="status" role="status">尚未開始</p><div class="screen" id="screen"></div><ol id="results"></ol>
<h2>測試後</h2><p>請截圖下面的六項結果。只有實際播到結尾才會標示「播放完成」；完成也不代表每一幀都順暢顯示，若有明顯卡頓請一併告訴我。</p>
</main></body></html>
